name = "ai-leaderboard-daily"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 每小时整点自动抓取一次榜单（备份机制：即使页面访问触发的后台抓取被
# isolate 回收打断，cron 也能在一小时内把数据写进 KV）
# 定时任务随本文件一起被 Cloudflare 部署，连接 GitHub 后自动生效
[triggers]
crons = ["0 * * * *"]

# KV 命名空间：部署前必须先创建并填入真实 ID，否则部署报 "KV namespace id is invalid"
# 方式一（Dashboard，GitHub 连接部署推荐）：
#   Storage & Databases → Workers KV → Create a namespace → 名称 LEADERBOARD_KV
#   复制 Namespace ID 填到下面，然后 git push（Cloudflare 自动部署）
# 方式二（命令行）：
#   npx wrangler kv namespace create LEADERBOARD_KV
[[kv_namespaces]]
binding = "LEADERBOARD_KV"
id = "4b622256e1464e7a8e7a7716e7a9f14f"

# Artificial Analysis 免费 API Key（可选）。
# 不配置也能运行：AA 榜单会显示引导，其余榜单正常抓取。
# 配置位置（GitHub 连接部署）：Worker → Settings → Variables and Secrets → Add
# 或命令行：npx wrangler secret put AA_API_KEY
# 切勿把密钥提交进仓库。

# 手动刷新接口 /api/refresh 的访问口令（可选，同上方式配置）
# 不配则接口公开。
